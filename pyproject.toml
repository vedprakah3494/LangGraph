[project]
name = "langgraphproject"
version = "0.1.0"
description = "LangGraph and RAG learning projects"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "certifi>=2024.6.20",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-chroma",
    "langchain-ollama>=0.1.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "ollama>=0.4.0,<1.0.0",
    "chromadb",
    "pypdf",
    "pyopenssl>=24.0.0",
    "python-certifi-win32>=0.1.7",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
